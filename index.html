<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bellota México - 8ª Gran Onco Carrera 2026</title>
<meta name="description" content="Comparte tus fotos de la 8ª Gran Onco Carrera 2026">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: #f3f3f3;
    font-family: Arial, Helvetica, sans-serif;
  }
  body {
    display: flex;
    justify-content: center;
  }
  .page {
    width: min(100%, 520px);
    min-height: 100vh;
    position: relative;
    background: #fff;
    overflow: hidden;
  }
  .poster {
    width: 100%;
    display: block;
  }
  .button-wrap {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    top: 50.5%;
    width: 78%;
  }
  .button {
    display: block;
    width: 100%;
    min-height: 88px;
    border-radius: 20px;
    text-decoration: none;
    /* botón transparente encima del botón dibujado en la imagen */
    background: rgba(255,255,255,0.001);
    -webkit-tap-highlight-color: transparent;
  }
  .sr-only {
    position:absolute;
    width:1px;
    height:1px;
    padding:0;
    margin:-1px;
    overflow:hidden;
    clip:rect(0,0,0,0);
    white-space:nowrap;
    border:0;
  }
</style>
</head>
<body>
  <main class="page">
    <img class="poster" src="portada-onco-carrera.png" alt="Bellota México - 8ª Gran Onco Carrera 2026">
    <div class="button-wrap">
      <a class="button" href="https://photos.app.goo.gl/mruGzBv9HjJWSb4B6" target="_blank" rel="noopener" aria-label="Sube y comparte tus fotos aquí">
        <span class="sr-only">Sube y comparte tus fotos aquí</span>
      </a>
    </div>
  </main>
</body>
</html>
